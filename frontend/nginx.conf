map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 100m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # P15-02 安全响应头。server 级 add_header 会被自带 add_header 的 location 阻断继承，
  # 故静态资源 location 内重复声明；CSP 先 Report-Only 观察（index.html 有内联脚本），
  # 必须带 report-to 指令否则 WebKit 记为 console error；报告经 /csp-report 丢弃收集，
  # enforce 阶段再换成真实上报端点。HSTS 仅在启用 TLS 的部署形态另行开启（docs/05 §7.2）。
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"/csp-report"}]}' always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.is.autonavi.com https://*.tianditu.gov.cn; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; report-to csp-endpoint" always;

  # CSP 报告收集端点（观察期丢弃，避免 404 噪音）
  location = /csp-report {
    return 204;
  }

  location = /api/v1/ws/notifications {
    proxy_pass http://backend:8080/api/v1/ws/notifications;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 限流按真实客户端 IP 归因：本段由 nginx 追加，后端取最后一段防伪造（docs/02 §1.4）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # P16-03 OpenAPI：UI 静态资源与 webjars 反代（api-docs 本体走 /api/ 段）。
  # 生产 Compose 默认 SCENARY_APIDOC_ENABLED=false，backend 404，无信息暴露面。
  location ~ ^/(swagger-ui|webjars|v3/api-docs) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location ^~ /minio/ {
    proxy_pass http://minio:9000/;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|gif|svg|woff2?)$ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"/csp-report"}]}' always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.is.autonavi.com https://*.tianditu.gov.cn; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; report-to csp-endpoint" always;
  }
}
