services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["scenary-mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server ${REDIS_ARGS}"]
    volumes: ["scenary-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes: ["scenary-mq-data:/var/lib/rabbitmq"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["scenary-minio-data:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1@sha256:95b5f3f7969a5c5a9f3a700ba72d5c84172819e13385aaf916e237cf111ab868
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/${MINIO_BUCKET} || true;
      mc anonymous set ${MINIO_BUCKET_POLICY:-none} local/${MINIO_BUCKET};
      echo BUCKET_READY"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_LISTENER_SIMPLE_ACKNOWLEDGE_MODE: manual
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 2
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 1
      SPRING_RABBITMQ_LISTENER_SIMPLE_DEFAULT_REQUEUE_REJECTED: "false"
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 200MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 205MB
      MYBATIS_MAPPER_LOCATIONS: classpath:mapper/*.xml
      MYBATIS_CONFIGURATION_MAP_UNDERSCORE_TO_CAMEL_CASE: "true"
      SCENARY_MINIO_ENDPOINT: http://minio:9000
      SCENARY_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      SCENARY_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SCENARY_MINIO_BUCKET: ${MINIO_BUCKET}
      SCENARY_MINIO_PUBLIC_HOST: http://${PUBLIC_HOST}:8081/minio
      SCENARY_MINIO_PRESIGN_ENDPOINT: http://${PUBLIC_HOST}:8081
      SCENARY_MINIO_PRESIGN_PATH_PREFIX: /minio
      SCENARY_MINIO_EXPOSE_ORIGINAL_URL: "false"
      # E2 私有桶读路径：展示 URL 运行时短时签名；false 为回滚模式（桶需保持 public-read）
      SCENARY_MEDIA_PRESIGN_READ: ${SCENARY_MEDIA_PRESIGN_READ:-true}
      SCENARY_MEDIA_PRESIGN_TTL_SECONDS: ${SCENARY_MEDIA_PRESIGN_TTL_SECONDS:-300}
      # P16-03 OpenAPI：生产 Compose 默认不出文档面；本地开发直连默认开启
      SCENARY_APIDOC_ENABLED: ${SCENARY_APIDOC_ENABLED:-false}
      SCENARY_JWT_SECRET: ${JWT_SECRET}
      SCENARY_JWT_ACCESS_TTL: ${JWT_ACCESS_TTL_SECONDS}
      SCENARY_JWT_REFRESH_TTL: ${JWT_REFRESH_TTL_SECONDS}
      SCENARY_JWT_ISSUER: scenary
      SCENARY_COMMENT_SENSITIVE_WORDS: ${SCENARY_COMMENT_SENSITIVE_WORDS:-诈骗,赌博,色情}
      SCENARY_WEBSOCKET_ALLOWED_ORIGINS: ${SCENARY_WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      # P15 写接口限流（docs/02 §1.4）：Compose 演示/验收默认放宽注册阈值容纳全量测试矩阵，
      # 生产部署在 .env 调回 20 或更低；其余阈值经同名变量覆盖
      SCENARY_RATELIMIT_REGISTER_PER_HOUR: ${SCENARY_RATELIMIT_REGISTER_PER_HOUR:-200}
      SCENARY_RATELIMIT_NOTE_PER_10MIN: ${SCENARY_RATELIMIT_NOTE_PER_10MIN:-30}
      SCENARY_RATELIMIT_SOCIAL_PER_MIN: ${SCENARY_RATELIMIT_SOCIAL_PER_MIN:-120}
      SCENARY_RATELIMIT_MEDIA_PER_10MIN: ${SCENARY_RATELIMIT_MEDIA_PER_10MIN:-60}
      SCENARY_RATELIMIT_EXEMPT_LOOPBACK: ${SCENARY_RATELIMIT_EXEMPT_LOOPBACK:-true}
      # P18 举报限流（默认 20/10min/用户）：Compose 演示放宽容纳黑盒矩阵，生产在 .env 调回
      SCENARY_RATELIMIT_REPORT_PER_10MIN: ${SCENARY_RATELIMIT_REPORT_PER_10MIN:-200}
      # P12-E3 逆地理编码（docs/05 §6.5）：默认关闭返回空候选；--profile geo 启用
      # nominatim 且导入 OSM 数据后，在 .env 置 SCENARY_PLACE_PROVIDER_ENABLED=true
      SCENARY_RATELIMIT_PLACE_PER_MIN: ${SCENARY_RATELIMIT_PLACE_PER_MIN:-30}
      SCENARY_PLACE_PROVIDER_ENABLED: ${SCENARY_PLACE_PROVIDER_ENABLED:-false}
      SCENARY_PLACE_PROVIDER_URL: ${SCENARY_PLACE_PROVIDER_URL:-http://nominatim:8080}
      SCENARY_PLACE_PROVIDER_TIMEOUT_MS: ${SCENARY_PLACE_PROVIDER_TIMEOUT_MS:-2000}
      SCENARY_PLACE_CACHE_TTL_DAYS: ${SCENARY_PLACE_CACHE_TTL_DAYS:-30}
      SCENARY_NOTIFICATION_CLEANUP_ENABLED: ${SCENARY_NOTIFICATION_CLEANUP_ENABLED:-true}
      SCENARY_NOTIFICATION_RETENTION_DAYS: ${SCENARY_NOTIFICATION_RETENTION_DAYS:-90}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["8081:80"]

  # P12-E3 自托管逆地理 provider（docs/05 §6.5）：仅内网可达（无 ports 映射，坐标不出内网）。
  # 默认不随栈启动；首次启用：docker compose --profile geo up -d nominatim，
  # 并在 .env 配 NOMINATIM_PBF_URL（区域 OSM pbf，如 download.geofabrik.de 的省级 extract）与
  # SCENARY_PLACE_PROVIDER_ENABLED=true；数据导入耗时长，FREEZE=1 防重启重复导入。
  nominatim:
    image: mediagis/nominatim:4.5
    profiles: ["geo"]
    restart: unless-stopped
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-}
      REPLICATION_URL: ""
      FREEZE: "true"
      THREADS: 4
    volumes: ["scenary-nominatim-data:/var/lib/postgresql"]
    shm_size: 1g

volumes:
  scenary-mysql-data:
  scenary-redis-data:
  scenary-mq-data:
  scenary-minio-data:
  scenary-nominatim-data:
