# Scenary · 开发期中间件基座（backend/frontend 不在此编排，全栈见根目录 docker-compose.yml）
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: [ "mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci" ]
    ports: ["3306:3306"]
    volumes: ["scenary-mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["scenary-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["scenary-mq-data:/var/lib/rabbitmq"]

  minio:
    # bitnamilegacy 日期 tag（官方 minio/* 已从 Hub 移除，CHANGELOG v2.48）
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    user: root
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["scenary-minio-data:/data"]

  minio-init:                       # 一次性建桶容器（aws-cli：mc 官方 Hub 镜像已移除）
    image: amazon/aws-cli:latest
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MC_BIN="$(command -v mc || echo /opt/bitnami/mc/bin/mc)"
        until "$$MC_BIN" alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done
        "$$MC_BIN" mb -p local/${MINIO_BUCKET} || true
        "$$MC_BIN" anonymous set download local/${MINIO_BUCKET}
        echo BUCKET_READY

volumes:
  scenary-mysql-data:
  scenary-redis-data:
  scenary-mq-data:
  scenary-minio-data:
