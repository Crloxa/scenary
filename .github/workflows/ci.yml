name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: scenary
      MYSQL_USER: scenary
      MYSQL_PASSWORD: scenary-pass
      MYSQL_ROOT_PASSWORD: root-pass
      RABBITMQ_DEFAULT_USER: scenary
      RABBITMQ_DEFAULT_PASS: mq-pass
      MINIO_ROOT_USER: scenary
      MINIO_ROOT_PASSWORD: minio-pass
      MINIO_BUCKET: scenary-media
      JWT_SECRET: 01234567890123456789012345678901
      JWT_ACCESS_TTL_SECONDS: 7200
      JWT_REFRESH_TTL_SECONDS: 2592000
      PUBLIC_HOST: localhost
      REDIS_ARGS: --appendonly no
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend test
        working-directory: backend
        run: mvn -q test
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend test
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Browser install
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # 浏览器 e2e 跑在真实 Compose 栈上（与本地验收同构：唯一入口 :8081），
      # 而非无后端的 Vite dev server——夹具均为路由 mock，但 WS/上传链路依赖真栈语义
      - name: Configure Docker Hub mirror
        run: |
          # minio 官方 Docker Hub 镜像已不可拉取（preflight 实证，CHANGELOG v2.48）；
          # mirror.gcr.io 为 Google 维护的 Docker Hub 缓存代理，GH runner 可达
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Preflight image pulls
        run: |
          for img in \
            mysql:8.4 \
            redis:7-alpine \
            rabbitmq:3.13-management \
            'minio/minio:latest' \
            'minio/mc:latest' \
            'bitnamilegacy/minio:latest' \
            'bitnamilegacy/mc:latest' \
            'bitnami/minio:latest' \
            'bitnami/mc:latest' \
            'seaweedfs/seaweedfs:latest' ; do
            if docker pull "$img" >/dev/null 2>&1; then
              echo "PULL OK: $img"
            else
              echo "::error::pull FAILED: $img"
            fi
          done

      - name: Probe minio sources
        run: |
          u1='https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.RELEASE.2025-09-07T16-13-09Z'
          u2='https://dl.min.io/server/minio/release/linux-amd64/minio'
          code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$u1" || true)
          echo "gh-release asset: $code"
          echo "::error::probe gh-release=$code"
          code2=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 30 "$u2" || true)
          echo "dl.min.io latest: $code2"
          echo "::error::probe dlminio=$code2"
          for i in 1 2 3; do
            if docker pull bitnamilegacy/minio:latest >/dev/null 2>&1; then
              echo "bitnamilegacy/minio pull OK on attempt $i"
              echo "::error::probe bitnami-minio=OK-attempt$i"
              break
            fi
            if [ "$i" = 3 ]; then echo "::error::probe bitnami-minio=FAIL"; fi
          done

      - name: Compose stack up
        run: |
          # pipefail 必须显式开启：否则 up 失败被 tee 吞掉（exit=tee 恒 0），容器不存在、后续步骤假失败
          set -o pipefail
          ok=0
          for i in 1 2; do
            if docker compose up -d --build 2>&1 | tee /tmp/compose-up.log; then ok=1; break; fi
            echo "attempt $i failed; cleaning up before retry"
            docker compose down --remove-orphans || true
          done
          if [ "$ok" != "1" ]; then
            echo "::error::compose up failed twice; build/run output tail below"
            tail -30 /tmp/compose-up.log | while IFS= read -r line; do
              echo "::error::compose: $line"
            done
            exit 1
          fi
      - name: Wait stack healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/v1/ping >/dev/null; then echo READY; exit 0; fi
            sleep 5
          done
          echo "::error::stack not healthy after 300s; diagnostics below"
          docker compose ps -a 2>&1 | while IFS= read -r line; do echo "::error::ps: $line"; done
          docker compose logs backend --tail 40 2>&1 | while IFS= read -r line; do
            echo "::error::be: $line"
          done
          exit 1
      - name: Frontend browser test (chromium, real stack)
        working-directory: frontend
        run: SCENARY_FRONTEND_URL=http://localhost:8081 npx playwright test --project=chromium
      - name: Black-box smoke (auth/e2e/places)
        run: |
          export SCENARY_API_BASE_URL=http://localhost:8081/api/v1
          node docs/dev/test-auth34.mjs
          node docs/dev/test-e2e38.mjs
          node docs/dev/test-p12-e3-places.mjs
          node docs/dev/test-e5-map.mjs
      - name: Compose config
        run: docker compose config --quiet
      - name: Compose middleware config
        run: docker compose -f docker-compose.middleware.yml config --quiet
      - name: Sensitive information scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |OPENSSH |EC |DSA |)PRIVATE KEY-----|AKIA[0-9A-Z]{16}|(ghp|github_pat|xox[baprs])-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}'
          if git grep -n -I -E -e "$pattern" -- ':!.env' ':!.env.*' ':!.env.example'; then
            echo 'Potential credential material found in tracked files.' >&2
            exit 1
          fi
