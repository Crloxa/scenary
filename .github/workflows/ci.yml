name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: scenary
      MYSQL_USER: scenary
      MYSQL_PASSWORD: scenary-pass
      MYSQL_ROOT_PASSWORD: root-pass
      RABBITMQ_DEFAULT_USER: scenary
      RABBITMQ_DEFAULT_PASS: mq-pass
      MINIO_ROOT_USER: scenary
      MINIO_ROOT_PASSWORD: minio-pass
      MINIO_BUCKET: scenary-media
      # 必须带引号：无引号的整串数字会被 YAML 解析为科学计数法（实测 1.23456789012346E+30），
      # 30 字符 < JwtProperties 的 32 位下限 → backend 启动即崩（learning 27）
      JWT_SECRET: '01234567890123456789012345678901'
      JWT_ACCESS_TTL_SECONDS: 7200
      JWT_REFRESH_TTL_SECONDS: 2592000
      PUBLIC_HOST: localhost
      REDIS_ARGS: --appendonly no
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend test
        working-directory: backend
        run: mvn -q test
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend test
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Browser install
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # 浏览器 e2e 跑在真实 Compose 栈上（与本地验收同构：唯一入口 :8081），
      # 而非无后端的 Vite dev server——夹具均为路由 mock，但 WS/上传链路依赖真栈语义
      - name: Configure Docker Hub mirror
        run: |
          # minio 官方 Docker Hub 镜像已不可拉取（preflight 实证，CHANGELOG v2.48）；
          # mirror.gcr.io 为 Google 维护的 Docker Hub 缓存代理，GH runner 可达
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Preflight image pulls
        run: |
          # bitnamilegacy 为 minio 唯一可得源（官方 Hub 镜像/GitHub releases/dl.min.io 均已移除，
          # 探针实证 CHANGELOG v2.48）；gcr mirror 偶发 cache miss → 重试拉齐后 compose --pull never。
          # 日期 tag 取自 Hub tag API 实测（2025.7.23 对，minio/mc 配对存在）；compose 默认值同源
          pull_retry() {
            img="$1"
            for i in 1 2 3 4 5; do
              if docker pull "$img" >/dev/null 2>&1; then
                echo "PULL OK (attempt $i): $img"
                return 0
              fi
              echo "pull attempt $i failed: $img"
              sleep 15
            done
            echo "::error::pull FAILED after 5 attempts: $img"
            return 1
          }
          pull_retry mysql:8.4
          pull_retry redis:7-alpine
          pull_retry rabbitmq:3.13-management
          pull_retry bitnamilegacy/minio:2025.7.23-debian-12-r5
          pull_retry amazon/aws-cli:latest
          # mc 已不再使用（建桶改 aws-cli，CHANGELOG v2.48）

      - name: Compose backend boot (capture boot logs)
        run: |
          set -o pipefail
          docker compose up -d --build --pull never backend 2>&1 | tee /tmp/compose-backend.log
          sleep 90
          docker compose logs backend > /tmp/backend-boot.log 2>&1 || true
          # 立即注解回传启动日志尾部（若 backend 冷启动失败，此处即现场）
          tail -c 2500 /tmp/backend-boot.log | gzip | base64 -w0 | fold -w 300 > /tmp/be.b64
          total=$(wc -l < /tmp/be.b64)
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            echo "::error::BEBOOT:$n/$total:$line"
          done < /tmp/be.b64
      - name: Compose stack up
        run: |
          # pipefail 必须显式开启：否则 up 失败被 tee 吞掉（exit=tee 恒 0）
          set -o pipefail
          ok=0
          for i in 1 2; do
            # --pull never：镜像已在 preflight 拉齐，运行时零拉取
            if docker compose up -d --build --pull never 2>&1 | tee /tmp/compose-up.log; then ok=1; break; fi
            echo "attempt $i failed; cleaning up before retry"
            docker compose down --remove-orphans || true
          done
          if [ "$ok" != "1" ]; then
            echo "::error::compose up failed twice; encoded diagnostics below (base64+gzip)"
            tail -c 3500 /tmp/compose-up.log | gzip | base64 -w0 | fold -w 300 > /tmp/clog.b64
            total=$(wc -l < /tmp/clog.b64)
            n=0
            while IFS= read -r line; do
              n=$((n + 1))
              echo "::error::CLOG:$n/$total:$line"
            done < /tmp/clog.b64
            exit 1
          fi
      - name: Wait stack healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/api/v1/ping >/dev/null; then echo READY; exit 0; fi
            sleep 5
          done
          echo "::error::stack not healthy after 300s"
          docker compose logs backend > /tmp/backend.log 2>&1 || true
          docker compose ps -a > /tmp/ps.txt 2>&1 || true
          exit 1
      - name: Upload stack diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stack-diagnostics
          path: |
            /tmp/compose-up.log
            /tmp/backend.log
            /tmp/ps.txt
      - name: Frontend browser test (chromium, real stack)
        working-directory: frontend
        run: SCENARY_FRONTEND_URL=http://localhost:8081 npx playwright test --project=chromium
      - name: Black-box smoke (auth/e2e/places)
        run: |
          export SCENARY_API_BASE_URL=http://localhost:8081/api/v1
          fail=0
          for t in test-auth34 test-e2e38 test-p12-e3-places test-e5-map; do
            if node "docs/dev/$t.mjs" > "/tmp/$t.out" 2>&1; then
              echo "$t: PASS"
            else
              echo "::error::smoke failed: $t"
              grep -E "^FAIL|⑧" "/tmp/$t.out" | tail -8 | while IFS= read -r line; do echo "::error::$t: $line"; done
              fail=1
            fi
          done
          exit $fail
      - name: Compose config
        run: docker compose config --quiet
      - name: Compose middleware config
        run: docker compose -f docker-compose.middleware.yml config --quiet
      - name: Sensitive information scan
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN (RSA |OPENSSH |EC |DSA |)PRIVATE KEY-----|AKIA[0-9A-Z]{16}|(ghp|github_pat|xox[baprs])-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}'
          if git grep -n -I -E -e "$pattern" -- ':!.env' ':!.env.*' ':!.env.example'; then
            echo 'Potential credential material found in tracked files.' >&2
            exit 1
          fi
