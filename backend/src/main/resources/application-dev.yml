# 本地开发配置（docs/03 Phase 3）。密钥走 env 占位符：仓库永远不出现真实密钥；
# 缺省值仅为「cp .env.example 后未注入 env」时的兜底，正式运行请经 backend/run-dev.sh 注入 .env。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/scenary?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
    username: scenary
    password: scenary_pwd_2026
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    username: scenary_mq
    password: mq_pwd_2026
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

scenary:
  jwt:
    # ≥32 字符约束见 docs/01 §8；dev 兜底串仅限本机联调
    secret: ${JWT_SECRET:dev-only-secret-0000000000000000000000ffff}
    access-ttl: 7200
    refresh-ttl: 2592000
    issuer: scenary
  minio:
    endpoint: http://localhost:9000
    access-key: minio_admin
    secret-key: ${MINIO_ROOT_PASSWORD:minio_pwd_change_me_2026}
    bucket: scenary-media
    public-host: http://localhost:9000
