# 本地开发配置（docs/03 Phase 3）。密钥全部走 env 占位符；
# 若未注入 .env，backend/run-dev.sh 会直接失败，不再使用默认密钥兜底。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/scenary?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 2
        prefetch: 1
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

scenary:
  jwt:
    # ≥32 字符约束见 docs/01 §8；本文件不提供兜底默认值
    secret: ${JWT_SECRET}
    access-ttl: 7200
    refresh-ttl: 2592000
    issuer: scenary
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    bucket: ${MINIO_BUCKET}
    public-host: http://localhost:9000
    presign-endpoint: ${SCENARY_MINIO_PRESIGN_ENDPOINT:http://localhost:9000}
    presign-path-prefix: ${SCENARY_MINIO_PRESIGN_PATH_PREFIX:}
    expose-original-url: false
  comment:
    sensitive-words: "${SCENARY_COMMENT_SENSITIVE_WORDS:诈骗,赌博,色情}"
  websocket:
    allowed-origins: "${SCENARY_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}"
